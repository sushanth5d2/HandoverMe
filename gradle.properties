org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Keep Kotlin compilation inside the Gradle process. This avoids Kotlin compile-daemon
# crashes on machines running newer JDKs (for example JDK 25).
kotlin.compiler.execution.strategy=in-process
# Keep Kotlin daemon disabled even if Gradle/IDE tries to start one.
kotlin.daemon.enabled=false
